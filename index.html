function showBank(id,ku){if(!ku)QU=null;var b=bankById(id);if(!b)return;var t=sumB(),fx=S.fixed.filter(function(f){return f.pay=='b:'+b.id&&!f.done}),fm=fx.reduce(function(s,f){return s+perMonth(f)},0),gs=S.goals.filter(function(g){return g.alloc&&g.alloc[b.id]>0}),un=b.amt-bankAlloc(b.id,-1);

var h='<div class="grab"></div><div class="sh"><h2><span class="dot" style="background:'+bankColor(b)+'"></span>'+esc(b.name)+'</h2><div style="display:flex;align-items:center;gap:8px;min-width:0">'+(b.note?'<span class="sm" style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(b.note)+'</span>':'')+'<button class="x" onclick="closeS()" aria-label="關閉">✕</button></div></div><div class="tot">'+money(b.amt)+'<small>'+(b.ex?'不計入存款總額':'佔總存款 '+Math.round(t?b.amt/t*100:0)+'%')+'</small></div>'
+'<div class="sm" style="margin:10px 0 8px">快速調整餘額（直接改金額，不產生收支記錄）</div><div class="chips" style="margin-bottom:8px">'+[-5000,-1000,-100,100,1000,5000].map(function(n){return '<button class="chip" onclick="qb('+id+','+n+')">'+(n>0?'＋':'－')+fnum(Math.abs(n))+'</button>'}).join('')+'</div><div class="addrow"><input class="in" id="qv" type="number" inputmode="decimal" placeholder="自訂金額"><button class="mini" onclick="qcus('+id+',1)">存入</button><button class="mini" style="background:var(--chip);color:var(--ink)" onclick="qcus('+id+',-1)">提領</button></div>'+(QU&&QU.id==id?'<div class="note">剛剛調整 '+(QU.n>=0?'＋':'－')+fnum(Math.abs(QU.n))+'　<button class="cx" style="color:var(--ink);text-decoration:underline" onclick="qundo('+id+')">復原</button></div>':'')+'<div class="row" style="margin-top:8px"><div class="m"><b>帳號末四碼</b></div><div class="a">'+(b.last4?esc(b.last4):'未填')+'</div></div>'
+dtl('存錢目標分配',gb)+dtl('從此帳戶扣款的固定項目',fb)+dtl('最近記錄',recentB(b.id)+xfB(b.id))+'<button class="add" onclick="openBank('+b.id+')">編輯帳戶</button>';$('sheet').innerHTML=h;show()}
function recentB(id){var k='b:'+id,L=S.items.filter(function(x){return x.pm==k}).sort(function(a,b){return b.d.localeCompare(a.d)||b.id-a.id}).slice(0,5);

/* cards, transfers, alerts, review, long-press */
function mdf(d){return d.slice(5).replace('-','/')}
function cClose(c){return (c.bill<=now.getDate()?MK:addM(MK,-1))+'-'+p(c.bill)}
function cStat(c){var k='c:'+c.id,ch=S.items.filter(function(x){return x.t=='exp'&&x.pm==k}),tot=0,upto=0,paid=0,cl=cClose(c),ck,dk,ds,din;
ch.forEach(function(x){tot+=x.a;if(x.d<=cl)upto+=x.a});S.cpay.forEach(function(x){if(x.card==c.id)paid+=x.a});
ck=cl.slice(0,7);dk=c.due>c.bill?ck:addM(ck,1);ds=dk+'-'+p(c.due);din=Math.round((new Date(ds+'T00:00:00')-new Date(TODAY+'T00:00:00'))/864e5);
return{tot:tot,paid:paid,unpaid:Math.max(0,tot-paid),billed:Math.max(0,Math.min(upto-paid,tot-paid)),cl:cl,ds:ds,din:din,ch:ch}}
function cardCap(){var u=S.cards.reduce(function(s,c){return s+cStat(c).unpaid},0);return u>0?'<div class="cap"><span>信用卡未繳（尚未從存款扣除）</span><span>'+money(u)+'</span></div>':''}
function cardsHtml(){var h='<div class="lh"><b>信用卡</b></div>'+S.cards.map(function(c){var st=cStat(c),col=cardColor(c),u=c.limit>0?st.unpaid/c.limit*100:0;return '<button class="card" onclick="showCard('+c.id+')"><div class="rt"><b><span class="dot" style="background:'+col+'"></span>'+esc(c.name)+'</b><b>'+money(st.unpaid)+'</b></div><div class="cap"><span>已出帳 '+money(st.billed)+'</span><span>'+(st.billed>0?'繳款日 '+mdf(st.ds)+'（'+(st.din<0?'已逾期':st.din==0?'今天':st.din+' 天後')+'）':'沒有待繳帳單')+'</span></div>'+(c.limit>0?'<div class="bar" style="background:var(--chip);margin-top:10px"><i style="width:'+Math.min(100,u)+'%;background:'+heat(u)+'"></i></div><div class="rs" style="margin-top:6px">額度 '+money(c.limit)+'，已用 '+Math.round(u)+'%</div>':'')+'</button>'}).join('');
return h+'<button class="add" style="background:var(--chip);color:var(--ink)" onclick="openCard(0)">新增信用卡</button>'}
function showCard(id){var c=cardById(id);if(!c)return;var st=cStat(c),pays=S.cpay.filter(function(x){return x.card==id}).sort(function(a,b){return b.d.localeCompare(a.d)||b.id-a.id}).slice(0,5),b=bankById(c.bank),ch=st.ch.slice().sort(function(a,b){return b.d.localeCompare(a.d)||b.id-a.id}).slice(0,8);
$('sheet').innerHTML=head('<span class="dot" style="background:'+cardColor(c)+'"></span>'+esc(c.name))+'<div class="tot exp">'+fmt(st.unpaid)+'<small>未繳總額</small></div><div class="row"><div class="m"><b>已出帳（到 '+mdf(st.cl)+'）</b><i>'+(st.billed>0?'繳款日 '+mdf(st.ds):'沒有待繳帳單')+'</i></div><div class="a">'+fmt(st.billed)+'</div></div><div class="row"><div class="m"><b>尚未出帳</b><i>每月 '+c.bill+' 日結帳、'+c.due+' 日繳款</i></div><div class="a">'+fmt(Math.max(0,st.unpaid-st.billed))+'</div></div><div class="row"><div class="m"><b>預設繳款帳戶</b></div><div class="a">'+(b?esc(b.name):'未設定')+'</div></div><button class="add" onclick="openCpay('+id+')">繳款</button>'
+'<div class="sm" style="margin-top:14px">繳款記錄</div>'+(pays.length?pays.map(function(x){var bb=bankById(x.bank);return '<div class="row"><div class="m"><b>'+(bb?esc(bb.name):'已刪除帳戶')+' 扣款</b><i>'+mdf(x.d)+'</i></div><div class="a">'+fmt(x.a)+'</div><button class="d" onclick="delCpay('+x.id+')" aria-label="刪除繳款記錄">✕</button></div>'}).join(''):'<div class="empty" style="padding:14px 0">還沒有繳款記錄</div>')
+'<div class="sm" style="margin-top:14px">最近刷卡</div>'+(ch.length?ch.map(function(x){return '<div class="row"><div class="m"><b>'+esc(x.c)+'</b><i>'+mdf(x.d)+(x.n?'・'+esc(x.n):'')+'</i></div><div class="a" style="color:var(--exp)">-'+fmt(x.a)+'</div></div>'}).join(''):'<div class="empty" style="padding:14px 0">還沒有用這張卡記帳</div>')
+'<button class="add" style="background:var(--chip);color:var(--ink)" onclick="openCard('+id+')">編輯信用卡</button>';show()}
function openCard(id){var c=cardById(id)||{bill:5,due:20,bank:S.banks[0]?S.banks[0].id:0};pcol=c.color||'';
$('sheet').innerHTML=head(c.id?'編輯信用卡':'新增信用卡')+'<div class="form"><div class="sm" style="margin-bottom:6px">卡片名稱</div><input id="cn" maxlength="10" placeholder="例如：玉山 Pi 卡" value="'+esc(c.name||'')+'"><div class="sm" style="margin-bottom:6px">每月結帳日（1–28）</div><input id="cb" type="number" inputmode="numeric" value="'+(c.bill||'')+'"><div class="sm" style="margin-bottom:6px">每月繳款截止日（1–28）</div><input id="cd" type="number" inputmode="numeric" value="'+(c.due||'')+'"><div class="sm" style="margin-bottom:6px">預設從哪個帳戶繳款</div><select id="cbk">'+S.banks.map(function(b){return '<option value="'+b.id+'"'+(b.id==c.bank?' selected':'')+'>'+esc(b.name)+'</option>'}).join('')+'</select><div class="sm" style="margin-bottom:6px">信用額度（可不填）</div><input id="cl" type="number" inputmode="decimal" placeholder="例如：100000" value="'+(c.limit||'')+'"><div class="sm" style="margin-bottom:8px">卡片顏色</div>'+swatches(FC)+'<div class="rs" style="margin-bottom:8px">刷卡的錢在消費當天就算進支出和預算，但要等你「繳款」時才會從存款扣掉。</div><button class="save" onclick="saveCard('+(c.id||0)+')">儲存</button>'+(c.id?'<button class="save" style="background:var(--chip);color:var(--exp)" onclick="delCard('+c.id+')">刪除信用卡</button>':'')+'</div>';show()}
function saveCard(id){var n=$('cn').value.trim(),bl=parseInt($('cb').value),du=parseInt($('cd').value),lm=parseFloat($('cl').value)||0,bk=+$('cbk').value||0,cl=isHex(pcol)?pcol:'';if(!n){$('cn').focus();return}if(!(bl>=1&&bl<=28)){$('cb').focus();return}if(!(du>=1&&du<=28)){$('cd').focus();return}
var o={id:id||UID++,name:n,bill:bl,due:du,bank:bk,limit:lm,color:cl};if(id)S.cards=S.cards.map(function(c){return c.id==id?o:c});else S.cards.push(o);save();render();closeS()}
function delCard(id){S.cards=S.cards.filter(function(c){return c.id!=id});S.cpay=S.cpay.filter(function(x){return x.card!=id});save();render();closeS()}
function openCpay(id){var c=cardById(id),st=cStat(c);if(!S.banks.length){$('sheet').innerHTML=head('繳款')+'<div class="empty">請先新增存款帳戶。</div>';show();return}
$('sheet').innerHTML=head('信用卡繳款')+'<div class="form"><div class="sm" style="margin-bottom:6px">繳款金額</div><input id="pa" type="number" inputmode="decimal" value="'+Math.round(st.billed||st.unpaid)+'"><div class="chips"><button class="chip" onclick="$(\'pa\').value='+Math.round(st.billed)+'">已出帳 '+fnum(st.billed)+'</button><button class="chip" onclick="$(\'pa\').value='+Math.round(st.unpaid)+'">全部未繳 '+fnum(st.unpaid)+'</button></div><div class="sm" style="margin-bottom:6px">從哪個帳戶扣</div><select id="pb">'+S.banks.map(function(b){return '<option value="'+b.id+'"'+(b.id==c.bank?' selected':'')+'>'+esc(b.name)+'（'+fnum(b.amt)+'）</option>'}).join('')+'</select><div class="sm" style="margin-bottom:6px">日期</div><input id="pd" type="date" max="'+TODAY+'" value="'+TODAY+'"><div id="cerr" class="rs" style="color:var(--exp);min-height:18px"></div><button class="save" onclick="saveCpay('+id+')">確定繳款</button></div>';show()}
function saveCpay(id){var a=parseFloat($('pa').value),b=bankById(+$('pb').value),d=$('pd').value;if(!(a>0)){$('pa').focus();return}if(!b)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d>TODAY)d=TODAY;if(b.amt<a){$('cerr').textContent='「'+b.name+'」餘額不足';return}
b.amt-=a;S.cpay.push({id:UID++,card:id,bank:b.id,a:a,d:d});save();render();showCard(id)}
function delCpay(id){var x=S.cpay.filter(function(y){return y.id==id})[0];if(!x)return;var b=bankById(x.bank);if(b)b.amt+=x.a;S.cpay=S.cpay.filter(function(y){return y.id!=id});save();render();showCard(x.card)}
function xfRow(x){return '<div class="row"><button class="rbtn" onclick="openXfer('+x.id+')"><div class="m"><b><span class="dot" style="background:var(--sub)"></span>轉帳</b><i>'+mdf(x.d)+' '+tagHtml('b:'+x.f)+' → '+tagHtml('b:'+x.t)+(x.n?'・'+esc(x.n):'')+'</i></div><div class="a" style="color:var(--sub)">'+fmt(x.a)+'</div></button></div>'}
function xfB(id){var L=S.xf.filter(function(x){return x.f==id||x.t==id}).sort(function(a,b){return b.d.localeCompare(a.d)||b.id-a.id}).slice(0,3);return L.length?'<div class="sm" style="margin-top:10px">最近轉帳</div>'+L.map(function(x){var o=x.f==id;return '<div class="row"><div class="m"><b>'+(o?'轉出到 ':'轉入自 ')+esc(pmLabel('b:'+(o?x.t:x.f)))+'</b><i>'+mdf(x.d)+'</i></div><div class="a" style="color:var(--'+(o?'exp':'inc')+')">'+(o?'-':'+')+fmt(x.a)+'</div></div>'}).join(''):''}
function monthRows(k,del,f){var L=S.items.filter(function(x){return x.d.indexOf(k)===0&&(f=='all'||x.t==f)}).map(function(x){return {d:x.d,id:x.id,h:rowH(x,del)}});if(f=='all')S.xf.forEach(function(x){if(x.d.indexOf(k)===0)L.push({d:x.d,id:x.id,h:xfRow(x)})});L.sort(function(a,b){return b.d.localeCompare(a.d)||b.id-a.id});return L.map(function(o){return o.h}).join('')}
function openXfer(id){var B=S.banks;if(B.length<2){$('sheet').innerHTML=head('轉帳')+'<div class="empty">需要至少兩個存款帳戶才能轉帳。</div>';show();return}
var x=S.xf.filter(function(y){return y.id==id})[0]||{f:B[0].id,t:B[1].id},o=function(sel){return B.map(function(b){return '<option value="'+b.id+'"'+(b.id==sel?' selected':'')+'>'+esc(b.name)+'（'+fnum(b.amt)+'）</option>'}).join('')};
$('sheet').innerHTML=head(x.id?'編輯轉帳':'轉帳')+'<div class="form"><div class="sm" style="margin-bottom:6px">從</div><select id="xf1">'+o(x.f)+'</select><div class="sm" style="margin-bottom:6px">轉到</div><select id="xf2">'+o(x.t)+'</select><div class="sm" style="margin-bottom:6px">金額</div><input id="xa" type="number" inputmode="decimal" placeholder="金額" value="'+(x.a||'')+'"><div class="sm" style="margin-bottom:6px">日期</div><input id="xd" type="date" max="'+TODAY+'" value="'+(x.d||TODAY)+'"><input id="xn" type="text" placeholder="備註（可不填）" value="'+esc(x.n||'')+'"><div id="xerr" class="rs" style="color:var(--exp);min-height:18px"></div><div class="rs" style="margin-bottom:8px">轉帳只會調整兩個帳戶的餘額，不算收入或支出，不會影響圖表和預算。</div><button class="save" onclick="saveXfer('+(x.id||0)+')">儲存</button>'+(x.id?'<button class="save" style="background:var(--chip);color:var(--exp)" onclick="delXfer('+x.id+')">刪除（餘額會還原）</button>':'')+'</div>';show()}
function xApply(x,s){var a=bankById(x.f),b=bankById(x.t);if(a)a.amt-=x.a*s;if(b)b.amt+=x.a*s}
function saveXfer(id){var f=+$('xf1').value,t=+$('xf2').value,a=parseFloat($('xa').value),d=$('xd').value,old=S.xf.filter(function(y){return y.id==id})[0];
if(f==t){$('xerr').textContent='轉出和轉入不能是同一個帳戶';return}if(!(a>0)){$('xa').focus();return}if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d>TODAY)d=TODAY;

function revData(k){var pk=addM(k,-1),c=byCat(k),pc=byCat(pk),big=null,n=0;S.items.forEach(function(x){if(x.d.indexOf(k)===0){n++;if(x.t=='exp'&&(!big||x.a>big.a))big=x}});return{i:sum(k,'inc'),e:sum(k,'exp'),pe:sum(pk,'exp'),c:c,pc:pc,big:big,n:n,names:Object.keys(c).sort(function(a,b){return c[b]-c[a]})}}

if(!cur){S.review.seen=MK;save();render()}

function hp4(s){var h=5381,i;s='ledger:'+s;for(i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return ''+h}

function drawLock(){var T={unlock:'輸入密碼',set1:'設定 4 位數密碼',set2:'再輸入一次確認',ver:'輸入目前的密碼'}[lk.m]||'',k=[1,2,3,4,5,6,7,8,9],pk=function(n){return '<button class="pk" onclick="lkKey('+n+')">'+n+'</button>'};

function lkKey(d){if(lk.buf.length>=4)return;lk.buf+=d;lk.msg='';drawLock();if(lk.buf.length==4)setTimeout(lkDone,120)}
function lkDel(){lk.buf=lk.buf.slice(0,-1);drawLock()}
function lkDone(){var b=lk.buf;if(b.length<4)return;lk.buf='';
if(lk.m=='unlock'){if(hp4(b)==S.pin)closeLock();else{lk.msg='密碼錯誤，請再試一次';drawLock()}return}
if(lk.m=='ver'){if(hp4(b)!=S.pin){lk.msg='密碼錯誤，請再試一次';drawLock();return}if(lk.act=='off'){S.pin='';save();closeLock();render();return}lk.m='set1';lk.msg='';drawLock();return}
if(lk.m=='set1'){lk.first=b;lk.m='set2';lk.msg='';drawLock();return}
if(lk.m=='set2'){if(b==lk.first){S.pin=hp4(b);save();closeLock();render()}else{lk.m='set1';lk.msg='兩次輸入不一致，請重新設定';drawLock()}}}
function lkForgot(){if(!lk.rs){lk.rs=1;drawLock();return}try{localStorage.removeItem(K)}catch(e){}try{location.reload()}catch(e){}}
