if(closed.length)h+='<button class="gl0" onclick="S.fold.lnc=!S.fold.lnc;save();render()">'+(S.fold.lnc?'收起':'顯示')+'已結清的 '+closed.length+' 筆</button>'+(S.fold.lnc?closed.map(function(l){return '<button class="card" style="opacity:.6" onclick="showLoan('+l.id+')"><div class="rt"><b>'+esc(l.who)+'</b><b>'+fmt(l.a)+'</b></div><div class="rs">'+mdf(l.d)+(l.n?'・'+esc(l.n):'')+'・已結清</div></button>'}).join(''):'');

/* cards, transfers, alerts, review, long-press */

ck=cl.slice(0,7);dk=c.due>c.bill?ck:addM(ck,1);ds=dk+'-'+p(c.due);din=Math.round((new Date(ds+'T00:00:00')-new Date(TODAY+'T00:00:00'))/864e5);

$('sheet').innerHTML=head(g.id?'編輯存錢目標':'新增存錢目標')+'<div class="form"><div class="sm" style="margin-bottom:6px">目標名稱</div><input id="gn" placeholder="例如：旅遊基金" value="'+esc(g.name||'')+'"><div class="sm" style="margin-bottom:6px">目標金額</div><input id="gt" type="number" inputmode="decimal" placeholder="目標金額" value="'+(g.target||'')+'"><div class="sm" style="margin-bottom:4px">每個帳戶存了多少（不放的帳戶留空）</div>'+S.banks.map(function(b){var o=bankAlloc(b.id,g.id||-1);return '<div class="row" style="padding:8px 0;border-top:0"><div class="m"><b><span class="dot" style="background:'+bankColor(b)+'"></span>'+esc(b.name)+'</b><i>最多可分配 '+fnum(Math.max(0,b.amt-o))+'</i></div><input class="in" style="width:120px;margin-top:0" id="ga'+b.id+'" type="number" inputmode="decimal" placeholder="0" value="'+(((g.alloc||{})[b.id])||'')+'"></div>'}).join('')+'<div id="gerr" class="rs" style="color:var(--exp);min-height:18px"></div><div class="sm" style="margin-bottom:6px">其他註記（可不填，例如：定存、放在家裡）</div><input id="gnote" type="text" maxlength="12" placeholder="註記" value="'+esc(g.note||'')+'"><div class="sm" style="margin-bottom:6px">手動輸入已存金額（上面都留空時才會用）</div><input id="gs" type="number" inputmode="decimal" placeholder="已存金額" value="'+(g.saved||'')+'"><button class="save" onclick="saveGoal('+(g.id||0)+')">儲存</button>'+(g.id?'<button class="save" style="background:var(--chip);color:var(--exp)" onclick="delGoal('+g.id+')">刪除目標</button>':'')+'</div>';show()}
function saveGoal(id){var n=$('gn').value.trim(),a=parseFloat($('gt').value),nt=$('gnote').value.trim(),sv=parseFloat($('gs').value)||0,al={},i,b,v,free;if(!n){$('gn').focus();return}if(!(a>0)){$('gt').focus();return}
for(i=0;i<S.banks.length;i++){b=S.banks[i];v=parseFloat($('ga'+b.id).value)||0;if(v>0){free=b.amt-bankAlloc(b.id,id||-1);if(v>free+0.001){$('gerr').textContent='「'+b.name+'」最多只能再分配 '+fnum(Math.max(0,free))+'（不能超過帳戶存款）';$('ga'+b.id).focus();return}al[b.id]=v}}
var o={id:id||UID++,name:n,target:a,banks:Object.keys(al).map(Number),alloc:al,note:nt,saved:sv};if(id)S.goals=S.goals.map(function(g){return g.id==id?o:g});else S.goals.push(o);save();render();closeS()}
function delGoal(id){S.goals=S.goals.filter(function(g){return g.id!=id});save();render();closeS()}
/* lock */
var lk={m:'',buf:'',first:'',act:'',msg:'',rs:0};
function hp4(s){var h=5381,i;s='ledger:'+s;for(i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return ''+h}
function openLock(m,act){lk.m=m;lk.act=act||'';lk.buf='';lk.first='';lk.msg='';lk.rs=0;drawLock();$('lock').classList.add('on')}
function closeLock(){lk.m='';$('lock').classList.remove('on')}
function drawLock(){var T={unlock:'輸入密碼',set1:'設定 4 位數密碼',set2:'再輸入一次確認',ver:'輸入目前的密碼'}[lk.m]||'',k=[1,2,3,4,5,6,7,8,9],pk=function(n){return '<button class="pk" onclick="lkKey('+n+')">'+n+'</button>'};
$('lock').innerHTML='<div class="lk"><div class="lkt">'+T+'</div><div class="dots">'+[0,1,2,3].map(function(i){return '<i class="'+(i<lk.buf.length?'on':'')+'"></i>'}).join('')+'</div><div class="lkm">'+(lk.msg||'&nbsp;')+'</div><div class="pad">'+k.map(pk).join('')+'<span></span>'+pk(0)+'<button class="pk" onclick="lkDel()" aria-label="刪除一位">⌫</button></div>'+(lk.m=='unlock'?'<button class="lkx" onclick="lkForgot()">'+(lk.rs?'再按一次，會清除所有資料':'忘記密碼？')+'</button>':'<button class="lkx" onclick="closeLock()">取消</button>')+'</div>'}
function lkKey(d){if(lk.buf.length>=4)return;lk.buf+=d;lk.msg='';drawLock();if(lk.buf.length==4)setTimeout(lkDone,120)}
function lkDel(){lk.buf=lk.buf.slice(0,-1);drawLock()}
function lkDone(){var b=lk.buf;if(b.length<4)return;lk.buf='';
if(lk.m=='unlock'){if(hp4(b)==S.pin)closeLock();else{lk.msg='密碼錯誤，請再試一次';drawLock()}return}
if(lk.m=='ver'){if(hp4(b)!=S.pin){lk.msg='密碼錯誤，請再試一次';drawLock();return}if(lk.act=='off'){S.pin='';save();closeLock();render();return}lk.m='set1';lk.msg='';drawLock();return}
if(lk.m=='set1'){lk.first=b;lk.m='set2';lk.msg='';drawLock();return}
if(lk.m=='set2'){if(b==lk.first){S.pin=hp4(b);save();closeLock();render()}else{lk.m='set1';lk.msg='兩次輸入不一致，請重新設定';drawLock()}}}
function lkForgot(){if(!lk.rs){lk.rs=1;drawLock();return}try{localStorage.removeItem(K)}catch(e){}try{location.reload()}catch(e){}}
applyTheme();applyFixed();applyFinc();applySip();applySettle();render();
if(document.addEventListener){document.addEventListener('visibilitychange',function(){if(document.hidden&&S.pin&&lk.m==='')openLock('unlock')});document.addEventListener('keydown',function(e){if(!lk.m)return;if(/^[0-9]$/.test(e.key))lkKey(+e.key);else if(e.key==='Backspace')lkDel()})}
if(S.pin)openLock('unlock');
(function(){var m=$('main');if(!m.addEventListener)return;
m.addEventListener('pointerdown',function(e){var el=e.target.closest&&e.target.closest('[data-lp]');if(!el)return;LP.x=e.clientX;LP.y=e.clientY;clearTimeout(LP.t);var v=el.getAttribute('data-lp');LP.t=setTimeout(function(){LP.f=Date.now();lpRun(v)},520)});
['pointerup','pointercancel','pointerleave'].forEach(function(n){m.addEventListener(n,function(){clearTimeout(LP.t)})});
m.addEventListener('pointermove',function(e){if(Math.abs(e.clientX-LP.x)>10||Math.abs(e.clientY-LP.y)>10)clearTimeout(LP.t)});
m.addEventListener('click',function(e){if(Date.now()-LP.f<700){e.stopPropagation();e.preventDefault()}},true);
m.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('[data-lp]'))e.preventDefault()})})();
</script>
